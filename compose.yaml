services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nova_test
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - nova_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  nova_postgres_data: