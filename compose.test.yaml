services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nova_test
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_local_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data