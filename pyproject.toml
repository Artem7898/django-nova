[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-nova"
version = "0.2.4"

description = "Next-generation Django toolkit: typed ORM, unified validation, async-first workflows, and smart caching"

readme = "README.md"
license = { text = "MIT" }

requires-python = ">=3.12"

authors = [
    { name = "Artem Alimpiev", email = "alimpievne@gmail.com" },
]

keywords = [
    "django",
    "django-framework",
    "orm",
    "pydantic",
    "async",
    "validation",
    "typing",
    "fastapi",
    "rest-framework",
]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",

    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "django>=5.0,<6.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "typing-extensions>=4.12",
    "cachetools>=5.4",
    "structlog>=24.0",
]

[project.optional-dependencies]
async = [
    "asyncpg>=0.30",
    "databases[asyncpg]>=0.9",
]

cache = [
    "redis>=5.0",
    "hiredis>=3.0",
]

tracing = [
    "opentelemetry-api>=1.20",
]

drf = [
    "djangorestframework>=3.15",
]

fastapi = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

tasks = [
    "asyncio-throttle>=1.0",
]


dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pytest-benchmark",

    "ruff>=0.6",
    "pyright>=1.1",

    "coverage>=7.6",

    "build>=1.5.0",
    "twine>=6.2.0",

    "httpx>=0.27",
    "hatch>=1.12",
]

[project.urls]
Homepage = "https://github.com/Artem7898/django-nova"
Repository = "https://github.com/Artem7898/django-nova"
Documentation = "https://github.com/Artem7898/django-nova#readme"
Issues = "https://github.com/Artem7898/django-nova/issues"


[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501", "RUF003", "RUF012",]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"


[tool.pytest.ini_options]

pythonpath = ["src", "."]

testpaths = ["tests"]

asyncio_mode = "auto"


DJANGO_SETTINGS_MODULE = "tests.example_project.settings"

markers = [
    "slow: marks tests as slow",
    "integration: integration tests",
    "benchmark: performance tests",
]

[tool.coverage.run]
source = ["nova"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]