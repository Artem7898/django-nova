name: Run Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Check types
        run: uv run --locked pyright src/nova

      - name: Lint
        run: uv run --locked ruff check .

      - name: Run tests on SQLite
        run: uv run --locked pytest -q -rs

  postgres:
    name: PostgreSQL ORM and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      NOVA_TEST_REDIS_URL: "redis://127.0.0.1:56379/0"
      NOVA_TEST_MEMCACHED_SERVER: "127.0.0.1:51211"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nova_test
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_local_test_only
        ports:
          - "55432:5432"
        options: >-
          --health-cmd "pg_isready -U nova -d nova_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - "56379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      memcached:
        image: memcached:1.6-alpine
        ports:
          - "51211:11211"
        options: >-
          --health-cmd "printf 'version\r\nquit\r\n' | nc -w 1 127.0.0.1 11211 | grep -q '^VERSION '"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run full test suite on PostgreSQL, Redis and Memcached
        run: >-
          uv run --locked pytest -q -rs
          --ds=tests.example_project.settings_postgres
          -W error::pytest.PytestWarning
          --tb=short